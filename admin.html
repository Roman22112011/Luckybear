<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyBear Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0B0E17;color:#fff;min-height:100vh;padding:16px}
        .container{max-width:800px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .logo{font-size:1.5rem;font-weight:700;color:#39FF14}
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .tab{padding:10px 20px;background:#161B29;border:1px solid #1E2538;border-radius:50px;color:#9BA3B5;cursor:pointer;font-size:.85rem;transition:all .3s}
        .tab.active{background:linear-gradient(135deg,#39FF14,#00F0FF);color:#0B0E17;border-color:transparent;font-weight:600}
        .card{background:#161B29;border:1px solid #1E2538;border-radius:16px;padding:20px;margin-bottom:16px}
        .card h3{margin-bottom:16px;font-size:1.1rem}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;color:#9BA3B5;margin-bottom:4px;font-size:.85rem}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;background:#0B0E17;border:1px solid #1E2538;border-radius:10px;color:#fff;font-size:.9rem}
        .form-group textarea{resize:vertical;min-height:60px}
        .btn{padding:10px 24px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9rem;transition:all .3s}
        .btn-primary{background:linear-gradient(135deg,#39FF14,#00F0FF);color:#0B0E17}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(57,255,20,0.3)}
        .btn-danger{background:#ff4444;color:#fff;margin-left:8px}
        .btn-danger:hover{background:#cc0000}
        .btn-outline{background:transparent;border:1px solid #1E2538;color:#9BA3B5}
        .btn-outline:hover{border-color:#39FF14;color:#fff}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1E2538;gap:12px;flex-wrap:wrap}
        .item-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
        .item-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1E2538;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden}
        .item-avatar img{width:100%;height:100%;object-fit:cover}
        .item-info{flex:1}
        .item-name{font-weight:600}.item-meta{color:#9BA3B5;font-size:.8rem}
        .item-actions{display:flex;gap:8px;flex-shrink:0}
        .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
        .badge-on{background:rgba(57,255,20,0.2);color:#39FF14}
        .badge-off{background:rgba(255,68,68,0.2);color:#ff4444}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
        .stat-box{background:#161B29;border:1px solid #1E2538;border-radius:12px;padding:16px;text-align:center}
        .stat-num{font-size:1.8rem;font-weight:700;color:#39FF14}
        .stat-label{color:#9BA3B5;font-size:.75rem;margin-top:4px}
        .login-box{max-width:360px;margin:80px auto;text-align:center}
        .login-box input{width:100%;padding:14px;background:#0B0E17;border:1px solid #1E2538;border-radius:10px;color:#fff;margin-bottom:12px;font-size:1rem;text-align:center}
        .error{color:#ff4444;margin-bottom:12px;font-size:.85rem}
        .img-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:8px 0;background:#1E2538;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
        .img-preview img{width:100%;height:100%;object-fit:cover}
        .file-input-wrapper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .file-input-wrapper input[type="file"]{display:none}
        .file-label{padding:8px 16px;background:#1E2538;border-radius:8px;cursor:pointer;font-size:.8rem;color:#9BA3B5;transition:all .3s}
        .file-label:hover{background:#2a3040;color:#fff}
        .emoji-input{display:flex;gap:8px;align-items:center}
        .emoji-input input{flex:1}
        .or-divider{color:#6B7280;font-size:.75rem;margin:0 4px}
        @media(max-width:480px){.header{flex-direction:column;align-items:flex-start}.item-row{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- Экран логина -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="logo" style="font-size:2rem;margin-bottom:24px">🐻 LuckyBear Admin</div>
            <input type="password" id="passInput" placeholder="Введите пароль">
            <div class="error" id="loginError" style="display:none">Неверный пароль</div>
            <button class="btn btn-primary" onclick="login()" style="width:100%">Войти</button>
        </div>
    </div>

    <!-- Админка -->
    <div id="adminScreen" style="display:none">
        <div class="header">
            <div class="logo">🐻 LuckyBear Admin</div>
            <button class="btn btn-outline" onclick="logout()">🚪 Выйти</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('links')">🔗 Ссылки</button>
            <button class="tab" onclick="switchTab('games')">🎮 Игры</button>
            <button class="tab" onclick="switchTab('reviews')">⭐ Отзывы</button>
            <button class="tab" onclick="switchTab('stats')">📊 Статистика</button>
        </div>

        <!-- Статистика -->
        <div id="tab-stats" style="display:none">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="card"><h3>📋 Последние события</h3><div id="eventsList"></div></div>
        </div>

        <!-- Ссылки -->
        <div id="tab-links">
            <div class="card">
                <h3>🔗 Управление ссылками</h3>
                <div class="form-group"><label>Ссылка "Забрать бонус" (Регистрация)</label><input id="regLink" placeholder="https://..."></div>
                <div class="form-group"><label>Ссылка "Играть"</label><input id="playLink" placeholder="https://..."></div>
                <button class="btn btn-primary" onclick="saveLinks()">💾 Сохранить ссылки</button>
            </div>
        </div>

        <!-- Игры -->
        <div id="tab-games" style="display:none">
            <div class="card">
                <h3 id="gameFormTitle">➕ Добавить игру</h3>
                <input type="hidden" id="gameEditId">
                
                <!-- Загрузка фото для игры -->
                <div class="form-group">
                    <label>🖼 Иконка игры (фото или emoji)</label>
                    <div class="img-preview" id="gameImgPreview">🎰</div>
                    <div class="file-input-wrapper">
                        <input type="file" id="gameImgFile" accept="image/*" onchange="previewGameImg(this)">
                        <label for="gameImgFile" class="file-label">📁 Выбрать фото</label>
                        <span class="or-divider">или</span>
                    </div>
                    <input type="text" id="gameIconEmoji" placeholder="Или вставьте emoji (🏛️)" oninput="updateGameEmojiPreview()" style="margin-top:8px">
                    <input type="hidden" id="gameIconData" value="">
                </div>

                <div class="form-group"><label>Название игры</label><input id="gameName" placeholder="Gates of Olympus"></div>
                <div class="form-group"><label>RTP (%)</label><input id="gameRtp" placeholder="96.50"></div>
                <div class="form-group"><label>Провайдер</label><input id="gameProvider" placeholder="Pragmatic Play"></div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="gameCat">
                        <option value="slots">🎰 Слоты</option>
                        <option value="live">📹 Live-дилеры</option>
                        <option value="crash">🚀 Краш-игры</option>
                    </select>
                </div>
                <div class="form-group"><label><input type="checkbox" id="gameActive" checked> Показывать на сайте</label></div>
                <button class="btn btn-primary" onclick="saveGame()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="cancelGameEdit()" id="gameCancelBtn" style="display:none">Отмена</button>
            </div>
            <div class="card"><h3>🎮 Список игр</h3><div id="gamesList"></div></div>
        </div>

        <!-- Отзывы -->
        <div id="tab-reviews" style="display:none">
            <div class="card">
                <h3 id="reviewFormTitle">➕ Добавить отзыв</h3>
                <input type="hidden" id="reviewEditId">
                
                <!-- Загрузка фото для отзыва -->
                <div class="form-group">
                    <label>🖼 Аватар (фото или emoji)</label>
                    <div class="img-preview" id="reviewImgPreview">👤</div>
                    <div class="file-input-wrapper">
                        <input type="file" id="reviewImgFile" accept="image/*" onchange="previewReviewImg(this)">
                        <label for="reviewImgFile" class="file-label">📁 Выбрать фото</label>
                        <span class="or-divider">или</span>
                    </div>
                    <input type="text" id="reviewAvatarEmoji" placeholder="Или вставьте emoji (👩‍🦰)" oninput="updateReviewEmojiPreview()" style="margin-top:8px">
                    <input type="hidden" id="reviewAvatarData" value="">
                </div>

                <div class="form-group"><label>Имя</label><input id="reviewName" placeholder="Мария К."></div>
                <div class="form-group"><label>Оценка (1-5)</label><input id="reviewStars" type="number" min="1" max="5" value="5"></div>
                <div class="form-group"><label>Текст отзыва</label><textarea id="reviewText" placeholder="Отличное казино..."></textarea></div>
                <div class="form-group"><label><input type="checkbox" id="reviewActive" checked> Показывать на сайте</label></div>
                <button class="btn btn-primary" onclick="saveReview()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="cancelReviewEdit()" id="reviewCancelBtn" style="display:none">Отмена</button>
            </div>
            <div class="card"><h3>⭐ Список отзывов</h3><div id="reviewsList"></div></div>
        </div>
    </div>
</div>

<script>
// ============ ДАННЫЕ ============
const DEFAULT_PASSWORD = 'admin123';
const STORAGE_KEY = 'luckybear_admin';

function getData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try { return JSON.parse(raw); } catch(e) {}
    }
    const def = {
        password: DEFAULT_PASSWORD,
        links: { register_link: '#', play_link: '#' },
        games: [
            {id:1,name:"Gates of Olympus",icon:"🏛️",iconType:"emoji",rtp:"96.50",provider:"Pragmatic Play",category:"slots",is_active:true},
            {id:2,name:"Sweet Bonanza",icon:"🍬",iconType:"emoji",rtp:"96.51",provider:"Pragmatic Play",category:"slots",is_active:true},
            {id:3,name:"Book of Dead",icon:"📖",iconType:"emoji",rtp:"96.21",provider:"Play'n GO",category:"slots",is_active:true},
            {id:4,name:"Aviator",icon:"✈️",iconType:"emoji",rtp:"97.00",provider:"Spribe",category:"crash",is_active:true},
            {id:5,name:"Crazy Time",icon:"🎡",iconType:"emoji",rtp:"96.08",provider:"Evolution",category:"live",is_active:true},
            {id:6,name:"Big Bamboo",icon:"🐼",iconType:"emoji",rtp:"96.13",provider:"Push Gaming",category:"slots",is_active:true}
        ],
        reviews: [
            {id:1,name:"Мария К.",avatar:"👩‍🦰",avatarType:"emoji",stars:5,text:"Регистрировалась ради фриспинов, а в итоге подняла x1200 в Gates of Olympus. Вывела за 5 минут!",is_active:true},
            {id:2,name:"Алексей В.",avatar:"👨",avatarType:"emoji",stars:5,text:"Медведь реально щедрый. Закинул 1000 рублей, играл в Aviator. Вывод пришел на карту мгновенно.",is_active:true},
            {id:3,name:"Игорь L.",avatar:"🧔",avatarType:"emoji",stars:5,text:"Лучший саппорт! Помогли разобраться с вейджером за пару минут. Всё честно и прозрачно.",is_active:true}
        ],
        events: []
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
    return def;
}

function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function trackEvent(event, meta = '') {
    const d = getData();
    d.events.unshift({event, meta, time: new Date().toLocaleString('ru')});
    if (d.events.length > 100) d.events = d.events.slice(0, 100);
    saveData(d);
}

// ============ КОНВЕРТАЦИЯ ФОТО В BASE64 ============
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ============ ПРЕДПРОСМОТР ИГРЫ ============
async function previewGameImg(input) {
    if (input.files && input.files[0]) {
        const base64 = await fileToBase64(input.files[0]);
        document.getElementById('gameIconData').value = base64;
        document.getElementById('gameImgPreview').innerHTML = `<img src="${base64}" alt="preview">`;
        document.getElementById('gameIconEmoji').value = '';
    }
}

function updateGameEmojiPreview() {
    const emoji = document.getElementById('gameIconEmoji').value;
    if (emoji) {
        document.getElementById('gameIconData').value = emoji;
        document.getElementById('gameImgPreview').textContent = emoji;
        document.getElementById('gameImgFile').value = '';
    }
}

// ============ ПРЕДПРОСМОТР ОТЗЫВА ============
async function previewReviewImg(input) {
    if (input.files && input.files[0]) {
        const base64 = await fileToBase64(input.files[0]);
        document.getElementById('reviewAvatarData').value = base64;
        document.getElementById('reviewImgPreview').innerHTML = `<img src="${base64}" alt="preview">`;
        document.getElementById('reviewAvatarEmoji').value = '';
    }
}

function updateReviewEmojiPreview() {
    const emoji = document.getElementById('reviewAvatarEmoji').value;
    if (emoji) {
        document.getElementById('reviewAvatarData').value = emoji;
        document.getElementById('reviewImgPreview').textContent = emoji;
        document.getElementById('reviewImgFile').value = '';
    }
}

// ============ АВТОРИЗАЦИЯ ============
function login() {
    const pass = document.getElementById('passInput').value;
    const d = getData();
    if (pass === d.password) {
        sessionStorage.setItem('admin_auth', '1');
        showAdmin();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

function logout() {
    sessionStorage.removeItem('admin_auth');
    location.reload();
}

function showAdmin() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    switchTab('links');
}

// ============ ТАБЫ ============
function switchTab(tab) {
    ['links','games','reviews','stats'].forEach(t => document.getElementById('tab-'+t).style.display = 'none');
    document.getElementById('tab-'+tab).style.display = 'block';
    document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        if ((tab==='links'&&t.textContent.includes('Ссылки'))||
            (tab==='games'&&t.textContent.includes('Игры'))||
            (tab==='reviews'&&t.textContent.includes('Отзывы'))||
            (tab==='stats'&&t.textContent.includes('Статистика'))) t.classList.add('active');
    });
    if (tab === 'links') loadLinks();
    if (tab === 'games') loadGames();
    if (tab === 'reviews') loadReviews();
    if (tab === 'stats') loadStats();
}

// ============ ССЫЛКИ ============
function loadLinks() {
    const d = getData();
    document.getElementById('regLink').value = d.links.register_link;
    document.getElementById('playLink').value = d.links.play_link;
}

function saveLinks() {
    const d = getData();
    d.links.register_link = document.getElementById('regLink').value;
    d.links.play_link = document.getElementById('playLink').value;
    saveData(d);
    trackEvent('links_updated');
    alert('✅ Ссылки сохранены!');
}

// ============ ИГРЫ ============
function getGameIconHTML(game) {
    if (game.iconType === 'image' && game.icon && game.icon.startsWith('data:image')) {
        return `<img src="${game.icon}" alt="${game.name}">`;
    }
    return game.icon || '🎰';
}

function loadGames() {
    const d = getData();
    document.getElementById('gamesList').innerHTML = d.games.map(g => `
        <div class="item-row">
            <div class="item-left">
                <div class="item-avatar">${getGameIconHTML(g)}</div>
                <div class="item-info">
                    <div class="item-name">${g.name}</div>
                    <div class="item-meta">RTP ${g.rtp}% | ${g.provider} | ${g.category}</div>
                </div>
            </div>
            <span class="badge ${g.is_active?'badge-on':'badge-off'}">${g.is_active?'Активна':'Скрыта'}</span>
            <div class="item-actions">
                <button class="btn btn-outline" style="padding:6px 12px;font-size:.75rem" onclick="editGame(${g.id})">✏️</button>
                <button class="btn btn-danger" style="padding:6px 12px;font-size:.75rem" onclick="deleteGame(${g.id})">🗑</button>
            </div>
        </div>`).join('') || '<p style="color:#6B7280;text-align:center;padding:20px">Нет добавленных игр</p>';
}

function editGame(id) {
    const d = getData();
    const g = d.games.find(x => x.id === id);
    if (!g) return;
    document.getElementById('gameEditId').value = g.id;
    document.getElementById('gameName').value = g.name;
    document.getElementById('gameRtp').value = g.rtp;
    document.getElementById('gameProvider').value = g.provider;
    document.getElementById('gameCat').value = g.category;
    document.getElementById('gameActive').checked = g.is_active;
    document.getElementById('gameIconData').value = g.icon || '';
    document.getElementById('gameIconEmoji').value = '';
    document.getElementById('gameImgFile').value = '';

    if (g.iconType === 'image' && g.icon && g.icon.startsWith('data:image')) {
        document.getElementById('gameImgPreview').innerHTML = `<img src="${g.icon}" alt="preview">`;
    } else {
        document.getElementById('gameImgPreview').textContent = g.icon || '🎰';
    }

    document.getElementById('gameFormTitle').textContent = '✏️ Редактировать игру';
    document.getElementById('gameCancelBtn').style.display = 'inline-block';
    switchTab('games');
}

function cancelGameEdit() {
    document.getElementById('gameEditId').value = '';
    document.getElementById('gameName').value = '';
    document.getElementById('gameRtp').value = '';
    document.getElementById('gameProvider').value = '';
    document.getElementById('gameIconData').value = '';
    document.getElementById('gameIconEmoji').value = '';
    document.getElementById('gameImgFile').value = '';
    document.getElementById('gameImgPreview').textContent = '🎰';
    document.getElementById('gameFormTitle').textContent = '➕ Добавить игру';
    document.getElementById('gameCancelBtn').style.display = 'none';
    loadGames();
}

function saveGame() {
    const d = getData();
    const id = document.getElementById('gameEditId').value;
    const iconData = document.getElementById('gameIconData').value;
    const isImage = iconData && iconData.startsWith('data:image');

    const obj = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById('gameName').value || 'Без названия',
        icon: iconData || '🎰',
        iconType: isImage ? 'image' : 'emoji',
        rtp: document.getElementById('gameRtp').value || '96.00',
        provider: document.getElementById('gameProvider').value || '',
        category: document.getElementById('gameCat').value,
        is_active: document.getElementById('gameActive').checked
    };

    if (id) {
        const idx = d.games.findIndex(x => x.id === parseInt(id));
        if (idx >= 0) d.games[idx] = obj;
    } else {
        d.games.push(obj);
    }
    saveData(d);
    trackEvent('game_saved', obj.name);
    cancelGameEdit();
    alert('✅ Игра сохранена!');
}

function deleteGame(id) {
    if (!confirm('Удалить игру?')) return;
    const d = getData();
    d.games = d.games.filter(x => x.id !== id);
    saveData(d);
    trackEvent('game_deleted');
    loadGames();
}

// ============ ОТЗЫВЫ ============
function getAvatarHTML(item) {
    if (item.avatarType === 'image' && item.avatar && item.avatar.startsWith('data:image')) {
        return `<img src="${item.avatar}" alt="${item.name}">`;
    }
    return item.avatar || '👤';
}

function loadReviews() {
    const d = getData();
    document.getElementById('reviewsList').innerHTML = d.reviews.map(r => `
        <div class="item-row">
            <div class="item-left">
                <div class="item-avatar">${getAvatarHTML(r)}</div>
                <div class="item-info">
                    <div class="item-name">${r.name} ${'⭐'.repeat(r.stars)}</div>
                    <div class="item-meta">${r.text.substring(0,80)}...</div>
                </div>
            </div>
            <span class="badge ${r.is_active?'badge-on':'badge-off'}">${r.is_active?'Активен':'Скрыт'}</span>
            <div class="item-actions">
                <button class="btn btn-outline" style="padding:6px 12px;font-size:.75rem" onclick="editReview(${r.id})">✏️</button>
                <button class="btn btn-danger" style="padding:6px 12px;font-size:.75rem" onclick="deleteReview(${r.id})">🗑</button>
            </div>
        </div>`).join('') || '<p style="color:#6B7280;text-align:center;padding:20px">Нет добавленных отзывов</p>';
}

function editReview(id) {
    const d = getData();
    const r = d.reviews.find(x => x.id === id);
    if (!r) return;
    document.getElementById('reviewEditId').value = r.id;
    document.getElementById('reviewName').value = r.name;
    document.getElementById('reviewStars').value = r.stars;
    document.getElementById('reviewText').value = r.text;
    document.getElementById('reviewActive').checked = r.is_active;
    document.getElementById('reviewAvatarData').value = r.avatar || '';
    document.getElementById('reviewAvatarEmoji').value = '';
    document.getElementById('reviewImgFile').value = '';

    if (r.avatarType === 'image' && r.avatar && r.avatar.startsWith('data:image')) {
        document.getElementById('reviewImgPreview').innerHTML = `<img src="${r.avatar}" alt="preview">`;
    } else {
        document.getElementById('reviewImgPreview').textContent = r.avatar || '👤';
    }

    document.getElementById('reviewFormTitle').textContent = '✏️ Редактировать отзыв';
    document.getElementById('reviewCancelBtn').style.display = 'inline-block';
    switchTab('reviews');
}

function cancelReviewEdit() {
    document.getElementById('reviewEditId').value = '';
    document.getElementById('reviewName').value = '';
    document.getElementById('reviewStars').value = '5';
    document.getElementById('reviewText').value = '';
    document.getElementById('reviewAvatarData').value = '';
    document.getElementById('reviewAvatarEmoji').value = '';
    document.getElementById('reviewImgFile').value = '';
    document.getElementById('reviewImgPreview').textContent = '👤';
    document.getElementById('reviewFormTitle').textContent = '➕ Добавить отзыв';
    document.getElementById('reviewCancelBtn').style.display = 'none';
    loadReviews();
}

function saveReview() {
    const d = getData();
    const id = document.getElementById('reviewEditId').value;
    const avatarData = document.getElementById('reviewAvatarData').value;
    const isImage = avatarData && avatarData.startsWith('data:image');

    const obj = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById('reviewName').value || 'Игрок',
        avatar: avatarData || '👤',
        avatarType: isImage ? 'image' : 'emoji',
        stars: parseInt(document.getElementById('reviewStars').value) || 5,
        text: document.getElementById('reviewText').value || '',
        is_active: document.getElementById('reviewActive').checked
    };

    if (id) {
        const idx = d.reviews.findIndex(x => x.id === parseInt(id));
        if (idx >= 0) d.reviews[idx] = obj;
    } else {
        d.reviews.push(obj);
    }
    saveData(d);
    trackEvent('review_saved', obj.name);
    cancelReviewEdit();
    alert('✅ Отзыв сохранён!');
}

function deleteReview(id) {
    if (!confirm('Удалить отзыв?')) return;
    const d = getData();
    d.reviews = d.reviews.filter(x => x.id !== id);
    saveData(d);
    trackEvent('review_deleted');
    loadReviews();
}

// ============ СТАТИСТИКА ============
function loadStats() {
    const d = getData();
    const total = d.events.length;
    const today = d.events.filter(e => e.time.includes(new Date().toLocaleDateString('ru'))).length;
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">📊 Всего событий</div></div>
        <div class="stat-box"><div class="stat-num">${today}</div><div class="stat-label">📅 Сегодня</div></div>
        <div class="stat-box"><div class="stat-num">${d.games.length}</div><div class="stat-label">🎮 Игр</div></div>
        <div class="stat-box"><div class="stat-num">${d.reviews.length}</div><div class="stat-label">⭐ Отзывов</div></div>
    `;
    document.getElementById('eventsList').innerHTML = d.events.slice(0, 20).map(e => 
        `<div class="item-row"><span style="color:#6B7280;font-size:.8rem">${e.time}</span> <strong>${e.event}</strong> <span style="color:#9BA3B5;font-size:.85rem">${e.meta}</span></div>`
    ).join('') || '<p style="color:#6B7280;text-align:center;padding:20px">Событий пока нет</p>';
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
function init() {
    getData();
    if (sessionStorage.getItem('admin_auth') === '1') showAdmin();
}
init();
</script>
