<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyBear Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0B0E17;color:#fff;min-height:100vh;padding:16px}
        .container{max-width:1100px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .logo{font-size:1.5rem;font-weight:700;color:#39FF14}
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .tab{padding:10px 20px;background:#161B29;border:1px solid #1E2538;border-radius:50px;color:#9BA3B5;cursor:pointer;font-size:.85rem;transition:all .3s}
        .tab.active{background:linear-gradient(135deg,#39FF14,#00F0FF);color:#0B0E17;border-color:transparent;font-weight:600}
        .card{background:#161B29;border:1px solid #1E2538;border-radius:16px;padding:20px;margin-bottom:16px}
        .card h3{margin-bottom:16px;font-size:1.1rem}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;color:#9BA3B5;margin-bottom:4px;font-size:.85rem}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;background:#0B0E17;border:1px solid #1E2538;border-radius:10px;color:#fff;font-size:.9rem}
        .form-group textarea{resize:vertical;min-height:60px}
        .btn{padding:10px 24px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9rem;transition:all .3s}
        .btn-primary{background:linear-gradient(135deg,#39FF14,#00F0FF);color:#0B0E17}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-danger{background:#ff4444;color:#fff;margin-left:8px}
        .btn-outline{background:transparent;border:1px solid #1E2538;color:#9BA3B5}
        .btn-outline:hover{border-color:#39FF14;color:#fff}
        .btn-sm{padding:5px 12px;font-size:.75rem}
        .item-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1E2538;gap:12px;flex-wrap:wrap}
        .item-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
        .item-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1E2538;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden}
        .item-avatar img{width:100%;height:100%;object-fit:cover}
        .item-info{flex:1}.item-name{font-weight:600}.item-meta{color:#9BA3B5;font-size:.8rem}
        .item-actions{display:flex;gap:8px;flex-shrink:0}
        .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
        .badge-on{background:rgba(57,255,20,0.2);color:#39FF14}
        .badge-off{background:rgba(255,68,68,0.2);color:#ff4444}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
        .stat-box{background:linear-gradient(135deg,#161B29,#1a1040);border:1px solid #1E2538;border-radius:12px;padding:16px;text-align:center}
        .stat-num{font-size:2rem;font-weight:700;color:#39FF14}
        .stat-label{color:#9BA3B5;font-size:.75rem;margin-top:4px}
        .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
        .chart-box{background:#161B29;border:1px solid #1E2538;border-radius:12px;padding:16px;position:relative;height:280px}
        .chart-box.full{grid-column:1/-1;height:300px}
        .login-box{max-width:380px;margin:80px auto;text-align:center}
        .login-box input{width:100%;padding:14px;background:#0B0E17;border:1px solid #1E2538;border-radius:10px;color:#fff;margin-bottom:12px;font-size:1rem;text-align:center}
        .error{color:#ff4444;margin-bottom:12px;font-size:.85rem}
        .img-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:8px 0;background:#1E2538;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
        .img-preview img{width:100%;height:100%;object-fit:cover}
        .file-input-wrapper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .file-input-wrapper input[type="file"]{display:none}
        .file-label{padding:8px 16px;background:#1E2538;border-radius:8px;cursor:pointer;font-size:.8rem;color:#9BA3B5}
        .file-label:hover{background:#2a3040;color:#fff}
        .or-divider{color:#6B7280;font-size:.75rem;margin:0 4px}
        .geo-flag{font-size:1.3rem;margin-right:4px}
        table{width:100%;border-collapse:collapse;font-size:.85rem}
        th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #1E2538}
        th{color:#9BA3B5;font-weight:500;font-size:.8rem;position:sticky;top:0;background:#161B29}
        .table-wrap{max-height:400px;overflow-y:auto;border-radius:8px}
        .user-row{cursor:pointer;transition:background .2s}
        .user-row:hover{background:rgba(57,255,20,0.05)}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:2000;align-items:center;justify-content:center;padding:16px}
        .modal-overlay.active{display:flex}
        .modal-box{background:#161B29;border:1px solid #1E2538;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
        .modal-close{float:right;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
        @media(max-width:768px){.charts-grid{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- Логин -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="logo" style="font-size:2rem;margin-bottom:24px">🐻 LuckyBear Admin</div>
            <input type="password" id="passInput" placeholder="Введите пароль">
            <div class="error" id="loginError" style="display:none">Неверный пароль</div>
            <button class="btn btn-primary" onclick="login()" style="width:100%">Войти</button>
        </div>
    </div>

    <!-- Админка -->
    <div id="adminScreen" style="display:none">
        <div class="header">
            <div class="logo">🐻 LuckyBear Admin</div>
            <button class="btn btn-outline" onclick="logout()">🚪 Выйти</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('stats')">📊 Статистика</button>
            <button class="tab" onclick="switchTab('links')">🔗 Ссылки</button>
            <button class="tab" onclick="switchTab('games')">🎮 Игры</button>
            <button class="tab" onclick="switchTab('reviews')">⭐ Отзывы</button>
        </div>

        <!-- ==================== СТАТИСТИКА ==================== -->
        <div id="tab-stats">
            <!-- Верхние метрики -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- Графики -->
            <div class="charts-grid">
                <div class="chart-box"><canvas id="chartVisits"></canvas></div>
                <div class="chart-box"><canvas id="chartDevices"></canvas></div>
                <div class="chart-box full"><canvas id="chartClicks"></canvas></div>
                <div class="chart-box"><canvas id="chartGeo"></canvas></div>
                <div class="chart-box"><canvas id="chartTimeOnSite"></canvas></div>
            </div>

            <!-- Таблица пользователей -->
            <div class="card">
                <h3>👥 Пользователи (кликните для деталей)</h3>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Пользователь</th><th>Страна</th><th>Устройство</th><th>Кликов</th><th>Время на сайте</th><th>Последняя активность</th></tr></thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Последние события -->
            <div class="card"><h3>📋 Лента событий</h3><div id="eventsFeed" style="max-height:300px;overflow-y:auto"></div></div>
        </div>

        <!-- ==================== ССЫЛКИ ==================== -->
        <div id="tab-links" style="display:none">
            <div class="card">
                <h3>🔗 Управление ссылками</h3>
                <div class="form-group"><label>Ссылка "Забрать бонус" (Регистрация)</label><input id="regLink" placeholder="https://..."></div>
                <div class="form-group"><label>Ссылка "Играть"</label><input id="playLink" placeholder="https://..."></div>
                <button class="btn btn-primary" onclick="saveLinks()">💾 Сохранить</button>
            </div>
        </div>

        <!-- ==================== ИГРЫ ==================== -->
        <div id="tab-games" style="display:none">
            <div class="card">
                <h3 id="gameFormTitle">➕ Добавить игру</h3>
                <input type="hidden" id="gameEditId">
                <div class="form-group">
                    <label>🖼 Иконка (фото или emoji)</label>
                    <div class="img-preview" id="gameImgPreview">🎰</div>
                    <div class="file-input-wrapper">
                        <input type="file" id="gameImgFile" accept="image/*" onchange="previewGameImg(this)">
                        <label for="gameImgFile" class="file-label">📁 Выбрать фото</label><span class="or-divider">или</span>
                    </div>
                    <input type="text" id="gameIconEmoji" placeholder="Или emoji (🏛️)" oninput="updateGameEmojiPreview()" style="margin-top:8px">
                    <input type="hidden" id="gameIconData" value="">
                </div>
                <div class="form-group"><label>Название</label><input id="gameName" placeholder="Gates of Olympus"></div>
                <div class="form-group"><label>RTP (%)</label><input id="gameRtp" placeholder="96.50"></div>
                <div class="form-group"><label>Провайдер</label><input id="gameProvider" placeholder="Pragmatic Play"></div>
                <div class="form-group"><label>Категория</label><select id="gameCat"><option value="slots">🎰 Слоты</option><option value="live">📹 Live</option><option value="crash">🚀 Краш</option></select></div>
                <div class="form-group"><label><input type="checkbox" id="gameActive" checked> Активна</label></div>
                <button class="btn btn-primary" onclick="saveGame()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="cancelGameEdit()" id="gameCancelBtn" style="display:none">Отмена</button>
            </div>
            <div class="card"><h3>🎮 Список игр</h3><div id="gamesList"></div></div>
        </div>

        <!-- ==================== ОТЗЫВЫ ==================== -->
        <div id="tab-reviews" style="display:none">
            <div class="card">
                <h3 id="reviewFormTitle">➕ Добавить отзыв</h3>
                <input type="hidden" id="reviewEditId">
                <div class="form-group">
                    <label>🖼 Аватар (фото или emoji)</label>
                    <div class="img-preview" id="reviewImgPreview">👤</div>
                    <div class="file-input-wrapper">
                        <input type="file" id="reviewImgFile" accept="image/*" onchange="previewReviewImg(this)">
                        <label for="reviewImgFile" class="file-label">📁 Выбрать фото</label><span class="or-divider">или</span>
                    </div>
                    <input type="text" id="reviewAvatarEmoji" placeholder="Или emoji (👩‍🦰)" oninput="updateReviewEmojiPreview()" style="margin-top:8px">
                    <input type="hidden" id="reviewAvatarData" value="">
                </div>
                <div class="form-group"><label>Имя</label><input id="reviewName" placeholder="Мария К."></div>
                <div class="form-group"><label>Оценка</label><input id="reviewStars" type="number" min="1" max="5" value="5"></div>
                <div class="form-group"><label>Текст</label><textarea id="reviewText" placeholder="Отличное казино..."></textarea></div>
                <div class="form-group"><label><input type="checkbox" id="reviewActive" checked> Активен</label></div>
                <button class="btn btn-primary" onclick="saveReview()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="cancelReviewEdit()" id="reviewCancelBtn" style="display:none">Отмена</button>
            </div>
            <div class="card"><h3>⭐ Список отзывов</h3><div id="reviewsList"></div></div>
        </div>
    </div>
</div>

<!-- Модалка деталей пользователя -->
<div class="modal-overlay" id="userModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeUserModal()">&times;</button>
        <h3 id="userModalTitle"></h3>
        <div id="userModalContent"></div>
    </div>
</div>

<script>
// ==================== ДАННЫЕ И ГЕНЕРАЦИЯ ====================
const STORAGE_KEY = 'luckybear_admin';
const DEFAULT_PASSWORD = 'admin123';

// Никнеймы
const NICKNAMES = ['LuckyFox','BearKing','SlotMaster','GoldHunter','SpinLord','CasinoWolf','JackPotter','DiceRoller','BetShark','WildAce','RoyalFlush','ChipStacker','FortuneCat','AceKnight','VegasSoul','SpinnerQueen','CoinDropper','DeckHero','CashNinja','RoulettePro'];

// Страны с флагами и городами
const COUNTRIES = [
    {code:'RU',flag:'🇷🇺',name:'Россия',cities:['Москва','СПб','Казань','Сочи','Новосибирск','Екб']},
    {code:'DE',flag:'🇩🇪',name:'Германия',cities:['Берлин','Мюнхен','Гамбург','Кёльн']},
    {code:'TR',flag:'🇹🇷',name:'Турция',cities:['Стамбул','Анкара','Анталья']},
    {code:'KZ',flag:'🇰🇿',name:'Казахстан',cities:['Алматы','Астана']},
    {code:'BR',flag:'🇧🇷',name:'Бразилия',cities:['Сан-Паулу','Рио']},
    {code:'IN',flag:'🇮🇳',name:'Индия',cities:['Мумбаи','Дели']},
    {code:'CA',flag:'🇨🇦',name:'Канада',cities:['Торонто','Ванкувер']},
    {code:'UA',flag:'🇺🇦',name:'Украина',cities:['Киев','Одесса']},
    {code:'PL',flag:'🇵🇱',name:'Польша',cities:['Варшава','Краков']},
    {code:'UZ',flag:'🇺🇿',name:'Узбекистан',cities:['Ташкент']},
];

const DEVICES = ['📱 Mobile','💻 Desktop','📲 Tablet'];
const OS_LIST = ['iOS 17','Android 14','Windows 11','macOS','iPadOS','Linux'];
const BROWSERS = ['Chrome','Safari','Firefox','Edge','Samsung Internet','Opera'];
const SCREENS = ['375×812','414×896','390×844','1920×1080','1440×900','1366×768','834×1194'];

function random(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }

// Генерация юзера
function genUser(id) {
    const country = random(COUNTRIES);
    return {
        id, nick: random(NICKNAMES), country, city: random(country.cities),
        device: random(DEVICES), os: random(OS_LIST), browser: random(BROWSERS), screen: random(SCREENS),
        firstVisit: new Date(Date.now()-randInt(0,14*86400000)).toISOString(),
        lastActive: new Date(Date.now()-randInt(0,86400000)).toISOString(),
        timeOnSite: randInt(15,3600),
        clicks: [],
        ip: `${randInt(1,255)}.${randInt(0,255)}.${randInt(0,255)}.${randInt(1,254)}`
    };
}

function genClick() {
    const actions = ['register_click','play_click','bonus_view','game_click','scroll_50%','scroll_100%','exit_intent','tab_switch'];
    const action = random(actions);
    const meta = action==='game_click'?`game:${randInt(1,6)}`:action==='tab_switch'?`tab:${random(['slots','live','crash'])}`:'';
    return {action, meta, time: new Date(Date.now()-randInt(0,86400000)).toISOString()};
}

// ==================== ХРАНИЛИЩЕ ====================
function getData() {
    let raw = localStorage.getItem(STORAGE_KEY);
    let data;
    if (raw) {
        try { data = JSON.parse(raw); } catch(e) { data = null; }
    }
    if (!data || !data.users) {
        data = {
            password: DEFAULT_PASSWORD,
            links: { register_link: '#', play_link: '#' },
            games: [
                {id:1,name:"Gates of Olympus",icon:"🏛️",iconType:"emoji",rtp:"96.50",provider:"Pragmatic Play",category:"slots",is_active:true},
                {id:2,name:"Sweet Bonanza",icon:"🍬",iconType:"emoji",rtp:"96.51",provider:"Pragmatic Play",category:"slots",is_active:true},
                {id:3,name:"Book of Dead",icon:"📖",iconType:"emoji",rtp:"96.21",provider:"Play'n GO",category:"slots",is_active:true},
                {id:4,name:"Aviator",icon:"✈️",iconType:"emoji",rtp:"97.00",provider:"Spribe",category:"crash",is_active:true},
                {id:5,name:"Crazy Time",icon:"🎡",iconType:"emoji",rtp:"96.08",provider:"Evolution",category:"live",is_active:true},
                {id:6,name:"Big Bamboo",icon:"🐼",iconType:"emoji",rtp:"96.13",provider:"Push Gaming",category:"slots",is_active:true}
            ],
            reviews: [
                {id:1,name:"Мария К.",avatar:"👩‍🦰",avatarType:"emoji",stars:5,text:"Регистрировалась ради фриспинов, а в итоге подняла x1200 в Gates of Olympus. Вывела за 5 минут!",is_active:true},
                {id:2,name:"Алексей В.",avatar:"👨",avatarType:"emoji",stars:5,text:"Медведь реально щедрый. Закинул 1000 рублей, играл в Aviator. Вывод пришел на карту мгновенно.",is_active:true},
                {id:3,name:"Игорь L.",avatar:"🧔",avatarType:"emoji",stars:5,text:"Лучший саппорт! Помогли разобраться с вейджером за пару минут. Всё честно и прозрачно.",is_active:true}
            ],
            users: [],
            events: []
        };
        // Генерируем 25 фейковых пользователей
        for(let i=1;i<=25;i++) {
            const u = genUser(i);
            const clickCount = randInt(2,15);
            for(let j=0;j<clickCount;j++) u.clicks.push(genClick());
            data.users.push(u);
        }
        saveData(data);
    }
    return data;
}

function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// ==================== АВТОРИЗАЦИЯ ====================
function login() {
    if (document.getElementById('passInput').value === getData().password) {
        sessionStorage.setItem('admin_auth','1'); showAdmin();
    } else { document.getElementById('loginError').style.display='block'; }
}
function logout() { sessionStorage.removeItem('admin_auth'); location.reload(); }
function showAdmin() {
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminScreen').style.display='block';
    switchTab('stats');
}

// ==================== ТАБЫ ====================
function switchTab(tab) {
    ['stats','links','games','reviews'].forEach(t => document.getElementById('tab-'+t).style.display='none');
    document.getElementById('tab-'+tab).style.display='block';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => {
        if((tab==='stats'&&t.textContent.includes('Статистика'))||
           (tab==='links'&&t.textContent.includes('Ссылки'))||
           (tab==='games'&&t.textContent.includes('Игры'))||
           (tab==='reviews'&&t.textContent.includes('Отзывы'))) t.classList.add('active');
    });
    if(tab==='stats') renderStats();
    if(tab==='links') loadLinks();
    if(tab==='games') loadGames();
    if(tab==='reviews') loadReviews();
}

// ==================== СТАТИСТИКА ====================
let charts = {};

function destroyCharts() {
    Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
    charts = {};
}

function renderStats() {
    const d = getData();
    const users = d.users;
    const allClicks = users.flatMap(u => u.clicks);
    const today = new Date().toDateString();
    const todayUsers = users.filter(u => new Date(u.lastActive).toDateString() === today).length;
    const todayClicks = allClicks.filter(c => new Date(c.time).toDateString() === today).length;
    const avgTime = users.length ? Math.round(users.reduce((s,u)=>s+u.timeOnSite,0)/users.length) : 0;

    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-box"><div class="stat-num">${users.length}</div><div class="stat-label">👥 Всего пользователей</div></div>
        <div class="stat-box"><div class="stat-num">${todayUsers}</div><div class="stat-label">📅 Сегодня</div></div>
        <div class="stat-box"><div class="stat-num">${allClicks.length}</div><div class="stat-label">🖱 Всего кликов</div></div>
        <div class="stat-box"><div class="stat-num">${todayClicks}</div><div class="stat-label">🖱 Кликов сегодня</div></div>
        <div class="stat-box"><div class="stat-num">${Math.floor(avgTime/60)}м ${avgTime%60}с</div><div class="stat-label">⏱ Среднее время</div></div>
        <div class="stat-box"><div class="stat-num">${new Set(users.map(u=>u.country.code)).size}</div><div class="stat-label">🌍 Стран</div></div>
    `;

    destroyCharts();

    // График посещений по дням
    const days = [];
    for(let i=6;i>=0;i--) {
        const date = new Date(Date.now()-i*86400000);
        const ds = date.toDateString();
        days.push({label: date.toLocaleDateString('ru',{weekday:'short',day:'numeric'}), count: users.filter(u => new Date(u.firstVisit).toDateString() <= ds).length});
    }
    charts.chartVisits = new Chart(document.getElementById('chartVisits'),{type:'line',data:{labels:days.map(d=>d.label),datasets:[{label:'Посетители',data:days.map(d=>d.count),borderColor:'#39FF14',backgroundColor:'rgba(57,255,20,0.1)',fill:true,tension:.4,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9BA3B5'}},y:{ticks:{color:'#9BA3B5'},beginAtZero:true}}}});

    // Устройства
    const devCounts = {};
    users.forEach(u => { const d = u.device; devCounts[d] = (devCounts[d]||0)+1; });
    charts.chartDevices = new Chart(document.getElementById('chartDevices'),{type:'doughnut',data:{labels:Object.keys(devCounts),datasets:[{data:Object.values(devCounts),backgroundColor:['#39FF14','#FFD700','#4F46E5'],borderColor:'#0B0E17'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#9BA3B5',fontSize:10}}}}});

    // Клики по часам
    const hours = Array(24).fill(0);
    allClicks.forEach(c => hours[new Date(c.time).getHours()]++);
    charts.chartClicks = new Chart(document.getElementById('chartClicks'),{type:'bar',data:{labels:Array.from({length:24},(_,i)=>`${i}:00`),datasets:[{label:'Клики',data:hours,backgroundColor:'rgba(57,255,20,0.5)',borderColor:'#39FF14',borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9BA3B5',maxTicksLimit:12}},y:{ticks:{color:'#9BA3B5'},beginAtZero:true}}}});

    // Гео
    const geoCounts = {};
    users.forEach(u => { const c = u.country.flag+' '+u.country.code; geoCounts[c] = (geoCounts[c]||0)+1; });
    charts.chartGeo = new Chart(document.getElementById('chartGeo'),{type:'bar',data:{labels:Object.keys(geoCounts),datasets:[{label:'Пользователи',data:Object.values(geoCounts),backgroundColor:['#39FF14','#FFD700','#4F46E5','#ff6b6b','#00d2ff','#ff8c00','#7c3aed','#ff69b4','#00ff88','#ff4444'],borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9BA3B5'},beginAtZero:true},y:{ticks:{color:'#9BA3B5'}}}}});

    // Время на сайте
    const timeBuckets = {'<1мин':0,'1-5мин':0,'5-15мин':0,'15-30мин':0,'30+ мин':0};
    users.forEach(u => {
        if(u.timeOnSite<60) timeBuckets['<1мин']++;
        else if(u.timeOnSite<300) timeBuckets['1-5мин']++;
        else if(u.timeOnSite<900) timeBuckets['5-15мин']++;
        else if(u.timeOnSite<1800) timeBuckets['15-30мин']++;
        else timeBuckets['30+ мин']++;
    });
    charts.chartTimeOnSite = new Chart(document.getElementById('chartTimeOnSite'),{type:'pie',data:{labels:Object.keys(timeBuckets),datasets:[{data:Object.values(timeBuckets),backgroundColor:['#39FF14','#FFD700','#4F46E5','#ff6b6b','#00d2ff']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#9BA3B5',fontSize:9}}}}});

    // Таблица пользователей
    document.getElementById('usersTable').innerHTML = users.map(u => `
        <tr class="user-row" onclick="showUserDetail(${u.id})">
            <td><strong>${u.nick}</strong></td>
            <td><span class="geo-flag">${u.country.flag}</span>${u.country.code}</td>
            <td>${u.device}</td>
            <td>${u.clicks.length}</td>
            <td>${Math.floor(u.timeOnSite/60)}м ${u.timeOnSite%60}с</td>
            <td>${new Date(u.lastActive).toLocaleString('ru')}</td>
        </tr>`).join('');

    // Лента событий
    const sortedEvents = allClicks.sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,30);
    document.getElementById('eventsFeed').innerHTML = sortedEvents.map(e => `
        <div class="item-row"><span style="color:#6B7280;font-size:.75rem">${new Date(e.time).toLocaleString('ru')}</span> <span class="badge badge-on">${e.action}</span> <span style="color:#9BA3B5;font-size:.8rem">${e.meta}</span></div>`).join('');
}

// ==================== МОДАЛКА ПОЛЬЗОВАТЕЛЯ ====================
function showUserDetail(id) {
    const u = getData().users.find(x => x.id === id);
    if (!u) return;
    document.getElementById('userModalTitle').textContent = `👤 ${u.nick} — детальная статистика`;
    document.getElementById('userModalContent').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
            <div><strong>🌍 Страна:</strong> ${u.country.flag} ${u.country.name}, ${u.city}</div>
            <div><strong>📱 Устройство:</strong> ${u.device}</div>
            <div><strong>💻 ОС:</strong> ${u.os}</div>
            <div><strong>🌐 Браузер:</strong> ${u.browser}</div>
            <div><strong>📐 Экран:</strong> ${u.screen}</div>
            <div><strong>🔢 IP:</strong> ${u.ip}</div>
            <div><strong>🕐 Первый визит:</strong> ${new Date(u.firstVisit).toLocaleString('ru')}</div>
            <div><strong>🕐 Последняя активность:</strong> ${new Date(u.lastActive).toLocaleString('ru')}</div>
            <div><strong>⏱ Время на сайте:</strong> ${Math.floor(u.timeOnSite/60)}м ${u.timeOnSite%60}с</div>
            <div><strong>🖱 Всего кликов:</strong> ${u.clicks.length}</div>
        </div>
        <h4 style="margin-bottom:8px">📋 История кликов:</h4>
        ${u.clicks.sort((a,b)=>new Date(b.time)-new Date(a.time)).map(c => `<div style="padding:6px 0;border-bottom:1px solid #1E2538;font-size:.85rem">${new Date(c.time).toLocaleString('ru')} — <span style="color:#39FF14">${c.action}</span> ${c.meta}</div>`).join('')}
    `;
    document.getElementById('userModal').classList.add('active');
}

function closeUserModal() { document.getElementById('userModal').classList.remove('active'); }
document.getElementById('userModal')?.addEventListener('click',function(e){if(e.target===this)closeUserModal();});

// ==================== ССЫЛКИ ====================
function loadLinks(){const d=getData();document.getElementById('regLink').value=d.links.register_link;document.getElementById('playLink').value=d.links.play_link}
function saveLinks(){const d=getData();d.links.register_link=document.getElementById('regLink').value;d.links.play_link=document.getElementById('playLink').value;saveData(d);alert('✅ Сохранено!')}

// ==================== ИГРЫ ====================
function getGameIconHTML(game){if(game.iconType==='image'&&game.icon?.startsWith('data:image'))return`<img src="${game.icon}" alt="${game.name}">`;return game.icon||'🎰'}
function loadGames(){const d=getData();document.getElementById('gamesList').innerHTML=d.games.map(g=>`<div class="item-row"><div class="item-left"><div class="item-avatar">${getGameIconHTML(g)}</div><div class="item-info"><div class="item-name">${g.name}</div><div class="item-meta">RTP ${g.rtp}% | ${g.provider} | ${g.category}</div></div></div><span class="badge ${g.is_active?'badge-on':'badge-off'}">${g.is_active?'Активна':'Скрыта'}</span><div class="item-actions"><button class="btn btn-outline btn-sm" onclick="editGame(${g.id})">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteGame(${g.id})">🗑</button></div></div>`).join('')||'<p style="color:#6B7280;text-align:center;padding:20px">Нет игр</p>'}
function editGame(id){const d=getData();const g=d.games.find(x=>x.id===id);if(!g)return;document.getElementById('gameEditId').value=g.id;document.getElementById('gameName').value=g.name;document.getElementById('gameRtp').value=g.rtp;document.getElementById('gameProvider').value=g.provider;document.getElementById('gameCat').value=g.category;document.getElementById('gameActive').checked=g.is_active;document.getElementById('gameIconData').value=g.icon||'';document.getElementById('gameIconEmoji').value='';document.getElementById('gameImgFile').value='';if(g.iconType==='image'&&g.icon?.startsWith('data:image')){document.getElementById('gameImgPreview').innerHTML=`<img src="${g.icon}" alt="preview">`}else{document.getElementById('gameImgPreview').textContent=g.icon||'🎰'}document.getElementById('gameFormTitle').textContent='✏️ Редактировать игру';document.getElementById('gameCancelBtn').style.display='inline-block';switchTab('games')}
function cancelGameEdit(){document.getElementById('gameEditId').value='';document.getElementById('gameName').value='';document.getElementById('gameRtp').value='';document.getElementById('gameProvider').value='';document.getElementById('gameIconData').value='';document.getElementById('gameIconEmoji').value='';document.getElementById('gameImgFile').value='';document.getElementById('gameImgPreview').textContent='🎰';document.getElementById('gameFormTitle').textContent='➕ Добавить игру';document.getElementById('gameCancelBtn').style.display='none';loadGames()}
function saveGame(){const d=getData();const id=document.getElementById('gameEditId').value;const iconData=document.getElementById('gameIconData').value;const isImage=iconData&&iconData.startsWith('data:image');const obj={id:id?parseInt(id):Date.now(),name:document.getElementById('gameName').value||'Без названия',icon:iconData||'🎰',iconType:isImage?'image':'emoji',rtp:document.getElementById('gameRtp').value||'96.00',provider:document.getElementById('gameProvider').value||'',category:document.getElementById('gameCat').value,is_active:document.getElementById('gameActive').checked};if(id){const idx=d.games.findIndex(x=>x.id===parseInt(id));if(idx>=0)d.games[idx]=obj}else{d.games.push(obj)}saveData(d);cancelGameEdit();alert('✅ Сохранено!')}
function deleteGame(id){if(!confirm('Удалить?'))return;const d=getData();d.games=d.games.filter(x=>x.id!==id);saveData(d);loadGames()}

async function previewGameImg(input){if(input.files&&input.files[0]){const base64=await fileToBase64(input.files[0]);document.getElementById('gameIconData').value=base64;document.getElementById('gameImgPreview').innerHTML=`<img src="${base64}" alt="preview">`;document.getElementById('gameIconEmoji').value=''}}
function updateGameEmojiPreview(){const emoji=document.getElementById('gameIconEmoji').value;if(emoji){document.getElementById('gameIconData').value=emoji;document.getElementById('gameImgPreview').textContent=emoji;document.getElementById('gameImgFile').value=''}}

// ==================== ОТЗЫВЫ ====================
function getAvatarHTML(item){if(item.avatarType==='image'&&item.avatar?.startsWith('data:image'))return`<img src="${item.avatar}" alt="${item.name}">`;return item.avatar||'👤'}
function loadReviews(){const d=getData();document.getElementById('reviewsList').innerHTML=d.reviews.map(r=>`<div class="item-row"><div class="item-left"><div class="item-avatar">${getAvatarHTML(r)}</div><div class="item-info"><div class="item-name">${r.name} ${'⭐'.repeat(r.stars)}</div><div class="item-meta">${r.text.substring(0,80)}...</div></div></div><span class="badge ${r.is_active?'badge-on':'badge-off'}">${r.is_active?'Активен':'Скрыт'}</span><div class="item-actions"><button class="btn btn-outline btn-sm" onclick="editReview(${r.id})">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id})">🗑</button></div></div>`).join('')||'<p style="color:#6B7280">Нет отзывов</p>'}
function editReview(id){const d=getData();const r=d.reviews.find(x=>x.id===id);if(!r)return;document.getElementById('reviewEditId').value=r.id;document.getElementById('reviewName').value=r.name;document.getElementById('reviewStars').value=r.stars;document.getElementById('reviewText').value=r.text;document.getElementById('reviewActive').checked=r.is_active;document.getElementById('reviewAvatarData').value=r.avatar||'';document.getElementById('reviewAvatarEmoji').value='';document.getElementById('reviewImgFile').value='';if(r.avatarType==='image'&&r.avatar?.startsWith('data:image')){document.getElementById('reviewImgPreview').innerHTML=`<img src="${r.avatar}" alt="preview">`}else{document.getElementById('reviewImgPreview').textContent=r.avatar||'👤'}document.getElementById('reviewFormTitle').textContent='✏️ Редактировать отзыв';document.getElementById('reviewCancelBtn').style.display='inline-block';switchTab('reviews')}
function cancelReviewEdit(){document.getElementById('reviewEditId').value='';document.getElementById('reviewName').value='';document.getElementById('reviewStars').value='5';document.getElementById('reviewText').value='';document.getElementById('reviewAvatarData').value='';document.getElementById('reviewAvatarEmoji').value='';document.getElementById('reviewImgFile').value='';document.getElementById('reviewImgPreview').textContent='👤';document.getElementById('reviewFormTitle').textContent='➕ Добавить отзыв';document.getElementById('reviewCancelBtn').style.display='none';loadReviews()}
function saveReview(){const d=getData();const id=document.getElementById('reviewEditId').value;const avatarData=document.getElementById('reviewAvatarData').value;const isImage=avatarData&&avatarData.startsWith('data:image');const obj={id:id?parseInt(id):Date.now(),name:document.getElementById('reviewName').value||'Игрок',avatar:avatarData||'👤',avatarType:isImage?'image':'emoji',stars:parseInt(document.getElementById('reviewStars').value)||5,text:document.getElementById('reviewText').value||'',is_active:document.getElementById('reviewActive').checked};if(id){const idx=d.reviews.findIndex(x=>x.id===parseInt(id));if(idx>=0)d.reviews[idx]=obj}else{d.reviews.push(obj)}saveData(d);cancelReviewEdit();alert('✅ Сохранено!')}
function deleteReview(id){if(!confirm('Удалить?'))return;const d=getData();d.reviews=d.reviews.filter(x=>x.id!==id);saveData(d);loadReviews()}

async function previewReviewImg(input){if(input.files&&input.files[0]){const base64=await fileToBase64(input.files[0]);document.getElementById('reviewAvatarData').value=base64;document.getElementById('reviewImgPreview').innerHTML=`<img src="${base64}" alt="preview">`;document.getElementById('reviewAvatarEmoji').value=''}}
function updateReviewEmojiPreview(){const emoji=document.getElementById('reviewAvatarEmoji').value;if(emoji){document.getElementById('reviewAvatarData').value=emoji;document.getElementById('reviewImgPreview').textContent=emoji;document.getElementById('reviewImgFile').value=''}}

function fileToBase64(file){return new Promise((resolve)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})}

// ==================== ИНИТ ====================
function init(){getData();if(sessionStorage.getItem('admin_auth')==='1')showAdmin()}
init();
</script>
